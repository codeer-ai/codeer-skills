[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeer-cli"
version = "0.1.0"
description = "Command line tools for managing Codeer agents over the Codeer API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
codeer = "codeer_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeer_cli"]
